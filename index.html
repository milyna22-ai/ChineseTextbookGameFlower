<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>尋找失落的愛蓮說</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="3D 濂溪書堂密室逃脫：解開四道機關，複習〈愛蓮說〉字音字義、託物言志與映襯。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap">
<style>
:root{
  /* Layout: a first-person 3D study fills the screen; close-ups open as mounted silk album leaves (冊頁) over the scene; HUD tags in lacquer and brass hug the corners. One dusk-study look by design, not theme-switched. */
  --lacquer:#1b0e0b;
  --lacquer-2:#2c1610;
  --rosewood:#3c1d16;
  --rosewood-2:#5b2e22;
  --silk:#eef2ec;
  --silk-2:#e0e7e0;
  --mount:#c3d4cb;
  --paper:#f3eddd;
  --ink:#1f1915;
  --ink-2:#4e453d;
  --ink-3:#7a7066;
  --celadon:#93b5a9;
  --celadon-deep:#3c6b60;
  --brass:#b88a3e;
  --brass-2:#e4c57f;
  --cinnabar:#ad2f29;
  --cinnabar-2:#f0aea4;
  --malachite:#2b7155;
  --lotus:#d4859a;
  --lotus-line:#b9677c;
  --chrys:#c9971f;
  --peony:#b4304f;
  --leaf:#5b8746;
  --mud:#4a3b2c;
  --root:#e6d6bf;
  --wood-1:#ddbe8b;
  --wood-2:#c39858;
  --wood-edge:#8b6435;
  --seal-ink:#f8ece6;
  --hud-bg:rgba(27,14,11,.76);
  --hud-line:rgba(228,197,127,.42);
  --line:rgba(60,107,96,.38);
  --line-soft:rgba(60,107,96,.2);
  --scrim:rgba(18,9,7,.6);
  --shadow:rgba(10,5,3,.45);
  --f-display:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","Noto Serif TC","Noto Serif CJK TC",serif;
  --f-body:"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif;
  --f-ui:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
  --fs-xs:13px; --fs-s:15px; --fs-m:17px; --fs-l:19px; --fs-xl:26px;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--lacquer);color:var(--silk);}
body{margin:0;font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;background:radial-gradient(ellipse at 50% 62%,var(--rosewood-2),var(--lacquer) 70%);}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;touch-action:manipulation;cursor:pointer;}
button:disabled{cursor:default;}
:focus-visible{outline:3px solid var(--brass-2);outline-offset:2px;}
[hidden]{display:none!important;}

/* ---------- HUD ---------- */
.hud-top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;z-index:10;pointer-events:none;}
.hud-top>*{pointer-events:auto;}
.hud-l{display:flex;flex-wrap:wrap;gap:8px;min-width:0;}
.hud-r{display:flex;gap:8px;flex-shrink:0;}
.tag{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:4px 12px;border-radius:8px;background:var(--hud-bg);border:1px solid var(--hud-line);color:var(--silk);font-size:var(--fs-s);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.tag-k{font-size:var(--fs-xs);color:var(--brass-2);letter-spacing:.08em;}
.tag-v{font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.02em;}
.tag-group{font-family:var(--f-display);font-size:var(--fs-l);}
.tag.warn .tag-v{color:var(--brass-2);}
.tag.over{border-color:var(--cinnabar);}
.tag.over .tag-v,.tag.over .tag-k{color:var(--cinnabar-2);}
.frag-dots{display:inline-flex;gap:4px;}
.frag-dot{width:11px;height:15px;border-radius:2px;border:1px solid var(--hud-line);}
.frag-dot.on{background:var(--paper);border-color:var(--paper);}
.hud-btn{min-height:38px;padding:4px 14px;border-radius:8px;background:var(--hud-bg);border:1px solid var(--hud-line);color:var(--silk);font-family:var(--f-display);font-size:var(--fs-m);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.hud-btn.icon{width:42px;padding:0;display:grid;place-items:center;}
.hud-btn svg{width:22px;height:22px;stroke:var(--brass-2);}
.hud-btn:active,.turn:active{transform:translateY(1px);}
.turn{position:fixed;top:50%;width:56px;height:56px;margin-top:-28px;border-radius:50%;background:var(--hud-bg);border:1px solid var(--hud-line);display:grid;place-items:center;z-index:9;}
.turn svg{width:28px;height:28px;stroke:var(--brass-2);}
.turn-l{left:max(12px,env(safe-area-inset-left,0px));}
.turn-r{right:max(12px,env(safe-area-inset-right,0px));}
.edge{position:fixed;top:calc(50% - 76px);padding:6px 14px;border-radius:999px;background:var(--brass-2);color:var(--lacquer);font-family:var(--f-display);font-size:var(--fs-m);z-index:9;pointer-events:none;box-shadow:0 6px 16px var(--shadow);}
.edge-l{left:max(14px,env(safe-area-inset-left,0px));animation:nudgeL 1.6s ease-in-out infinite;}
.edge-r{right:max(14px,env(safe-area-inset-right,0px));animation:nudgeR 1.6s ease-in-out infinite;}
.dialog{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);margin-inline:auto;max-width:720px;display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--silk);color:var(--ink);border:3px solid var(--rosewood);box-shadow:inset 0 0 0 3px var(--mount),0 14px 30px var(--shadow);z-index:12;cursor:pointer;color-scheme:light;}
.dialog p{margin:0;flex:1;min-width:0;font-family:var(--f-display);font-size:var(--fs-l);line-height:1.55;}
.dialog .dlg-ok{flex:none;padding:8px 12px;border-radius:8px;border:1px solid var(--line);color:var(--celadon-deep);font-family:var(--f-display);font-size:var(--fs-s);}
.quicknav{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;z-index:11;transform:translateY(200%);}
.quicknav:focus-within,.quicknav.show{transform:none;}
.quicknav.show{bottom:calc(env(safe-area-inset-bottom,0px) + 110px);}
.quicknav button{padding:8px 14px;border-radius:8px;background:var(--hud-bg);border:1px solid var(--hud-line);font-family:var(--f-display);font-size:var(--fs-m);}

/* ---------- overlays & leaves ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(ellipse at 50% 45%,rgba(18,9,7,.2),var(--scrim));}
.leaf{position:relative;width:min(960px,100%);max-height:100%;display:flex;flex-direction:column;background-color:var(--silk);background-image:repeating-linear-gradient(0deg,rgba(31,25,21,.022) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(31,25,21,.016) 0 1px,transparent 1px 4px);color:var(--ink);border-radius:8px;border:6px solid var(--rosewood);box-shadow:inset 0 0 0 5px var(--mount),0 0 0 1px var(--brass),0 30px 70px var(--shadow);color-scheme:light;animation:leafIn .32s cubic-bezier(.2,.9,.3,1);}
.leaf.w-clue,.leaf.w-chest,.leaf.w-frag,.leaf.w-small{width:min(720px,100%);}
.leaf.w-ms{width:min(820px,100%);}
.leaf-head{display:flex;align-items:center;gap:14px;padding:16px 18px 12px 20px;border-bottom:1px solid var(--line-soft);}
.seal{flex:none;width:46px;height:46px;display:grid;place-items:center;border-radius:5px;background:var(--cinnabar);color:var(--seal-ink);font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1;box-shadow:inset 0 0 0 2px rgba(248,236,230,.28);}
.seal.sm{width:42px;height:42px;font-size:16px;writing-mode:vertical-rl;letter-spacing:.06em;}
.leaf-titles{flex:1;min-width:0;}
.eyebrow{margin:0;font-size:var(--fs-xs);letter-spacing:.14em;color:var(--celadon-deep);font-weight:600;}
.leaf-head h2{margin:2px 0 0;font-family:var(--f-display);font-size:var(--fs-xl);font-weight:700;line-height:1.2;text-wrap:balance;}
.btn-close{flex:none;min-height:42px;padding:6px 14px;border-radius:8px;border:1px solid var(--celadon-deep);color:var(--celadon-deep);font-family:var(--f-display);font-size:var(--fs-m);}
.leaf-body{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 20px 22px;font-size:var(--fs-m);}
.brief{margin:0 0 14px;color:var(--ink-2);max-width:64ch;}
.feedback{min-height:1.6em;margin:14px 0 0;text-align:center;color:var(--cinnabar);font-weight:600;}
.feedback.good{color:var(--malachite);}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:8px 24px;border-radius:9px;font-family:var(--f-display);font-size:var(--fs-l);font-weight:700;letter-spacing:.06em;}
.btn.primary{background:linear-gradient(180deg,var(--brass-2),var(--brass));color:var(--lacquer);border:1px solid var(--wood-edge);box-shadow:0 3px 0 var(--wood-edge),0 10px 20px rgba(139,100,53,.3);}
.btn.primary:active{transform:translateY(3px);box-shadow:0 0 0 var(--wood-edge);}
.btn.ghost{border:1px solid var(--celadon-deep);color:var(--celadon-deep);font-weight:400;}

/* ---------- title ---------- */
.title-screen{background:linear-gradient(100deg,rgba(18,9,7,.82),rgba(18,9,7,.5) 60%,rgba(18,9,7,.18));}
.cover{display:flex;gap:24px;width:min(880px,100%);max-height:100%;overflow:auto;padding:24px;border-radius:10px;background:var(--silk);color:var(--ink);border:6px solid var(--rosewood);box-shadow:inset 0 0 0 5px var(--mount),0 0 0 1px var(--brass),0 30px 80px var(--shadow);color-scheme:light;}
.tiqian{flex:none;writing-mode:vertical-rl;display:flex;align-items:center;gap:16px;padding:20px 12px;border-radius:3px;background:var(--paper);box-shadow:inset 0 0 0 1px rgba(120,90,50,.35),inset 0 0 0 6px var(--paper),inset 0 0 0 7px rgba(120,90,50,.28);}
.tiqian h1{margin:0;font-family:var(--f-display);font-size:46px;font-weight:700;letter-spacing:.16em;line-height:1.1;}
.tiqian .sub{font-family:var(--f-body);font-size:var(--fs-s);color:var(--ink-2);letter-spacing:.3em;}
.tiqian .seal{writing-mode:horizontal-tb;}
.cover-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;}
.story{margin:0;font-family:var(--f-body);font-size:var(--fs-m);line-height:1.9;max-width:46ch;}
.levels{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none;}
.levels li{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--silk-2);font-family:var(--f-display);font-size:var(--fs-s);}
.levels b{display:grid;place-items:center;width:24px;height:24px;border-radius:4px;background:var(--cinnabar);color:var(--seal-ink);font-size:14px;}
.field{display:flex;flex-direction:column;gap:8px;}
.field-k{font-size:var(--fs-xs);letter-spacing:.14em;color:var(--celadon-deep);font-weight:600;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{min-height:38px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);font-family:var(--f-display);font-size:var(--fs-m);color:var(--ink);}
.chip[aria-pressed="true"]{background:var(--celadon-deep);border-color:var(--celadon-deep);color:var(--silk);}
.text-in{width:100%;max-width:260px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--silk);color:var(--ink);font-family:var(--f-display);font-size:var(--fs-l);-webkit-user-select:text;user-select:text;}
.seg{display:inline-flex;flex-wrap:wrap;align-self:flex-start;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.seg button{min-height:40px;padding:4px 16px;font-family:var(--f-display);font-size:var(--fs-m);color:var(--ink);}
.seg button+button{border-left:1px solid var(--line-soft);}
.seg button[aria-checked="true"]{background:var(--celadon-deep);color:var(--silk);}
.howto{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none;font-size:var(--fs-s);color:var(--ink-2);}
.howto b{font-family:var(--f-display);font-weight:700;color:var(--ink);margin-right:4px;}
.cover-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
.resume-note{margin:0;font-size:var(--fs-s);color:var(--ink-2);}

/* ---------- level 1: wheels ---------- */
.wheels{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;}
.wheel{flex:1 1 124px;max-width:164px;display:flex;flex-direction:column;align-items:center;gap:6px;}
.wheel-head{display:flex;flex-direction:column;align-items:center;gap:4px;}
.wheel-ch{display:grid;place-items:center;width:58px;height:58px;border-radius:8px;background:var(--lacquer-2);color:var(--brass-2);font-family:var(--f-display);font-size:38px;line-height:1;box-shadow:inset 0 0 0 2px var(--brass);}
.wheel-ctx{font-family:var(--f-body);font-size:var(--fs-s);color:var(--ink-2);white-space:nowrap;}
.wheel-ctx b{color:var(--cinnabar);}
.wbtn{width:100%;height:38px;border-radius:8px;display:grid;place-items:center;background:var(--silk-2);border:1px solid var(--line);}
.wbtn svg{width:22px;height:22px;stroke:var(--celadon-deep);}
.wbtn:disabled{opacity:.3;}
.drum-win{--half:46px;position:relative;width:100%;height:104px;border-radius:10px;background:var(--lacquer);box-shadow:inset 0 0 0 3px var(--brass);perspective:420px;overflow:hidden;cursor:pointer;}
.drum-win::after{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 28%,transparent 72%,rgba(0,0,0,.55));}
.drum{position:absolute;inset:6px;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.3,1.35,.5,1);}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:6px;background:linear-gradient(180deg,var(--lacquer-2),var(--rosewood-2) 50%,var(--lacquer-2));color:var(--silk);-webkit-backface-visibility:hidden;backface-visibility:hidden;}
.zy{font-family:var(--f-body);font-size:23px;color:var(--brass-2);line-height:1.15;letter-spacing:.04em;}
.mean{font-family:var(--f-display);font-size:var(--fs-m);line-height:1.2;text-align:center;padding-inline:4px;}
.wheel.locked .drum-win{box-shadow:inset 0 0 0 3px var(--malachite);cursor:default;}
.ok-badge{position:absolute;top:5px;right:5px;z-index:2;width:24px;height:24px;display:grid;place-items:center;border-radius:4px;background:var(--malachite);color:var(--silk);font-family:var(--f-display);font-size:14px;}
.wheel.bad .drum-win{box-shadow:inset 0 0 0 3px var(--cinnabar);animation:shake .45s;}
.wheel-fb{margin:0;min-height:1.4em;font-size:var(--fs-xs);color:var(--cinnabar);text-align:center;font-weight:600;}
.wordlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin:16px 0 0;padding:0;list-style:none;}
.wordlist li{display:flex;align-items:baseline;gap:8px;padding:8px 12px;border-radius:8px;background:var(--silk-2);}
.wordlist .w{font-family:var(--f-display);font-size:24px;}
.wordlist .p{font-family:var(--f-body);font-size:var(--fs-s);color:var(--celadon-deep);white-space:nowrap;}
.summary .wordlist{margin-top:4px;background:transparent;}
.summary .wordlist li{background:var(--silk);}
.wordlist .m{font-family:var(--f-display);font-size:var(--fs-m);}

/* ---------- tiles & slots ---------- */
.tray{margin-top:14px;padding:12px;border-radius:10px;background:var(--silk-2);border:1px solid var(--line-soft);}
.tray-k{margin:0 0 8px;font-size:var(--fs-xs);letter-spacing:.1em;color:var(--celadon-deep);font-weight:600;}
.tray-tiles{display:flex;flex-wrap:wrap;gap:10px;}
.tile{position:relative;padding:9px 14px 9px 27px;border-radius:6px;background:linear-gradient(180deg,var(--wood-1),var(--wood-2));color:var(--ink);border:1px solid var(--wood-edge);box-shadow:0 2px 0 var(--wood-edge),0 6px 12px rgba(80,50,20,.18);font-family:var(--f-display);font-size:var(--fs-l);line-height:1.35;text-align:left;transition:transform .15s,box-shadow .15s;}
.tile::before{content:"";position:absolute;left:10px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--silk-2);box-shadow:inset 0 1px 2px rgba(0,0,0,.45);}
.tile.sel{transform:translateY(-4px);box-shadow:0 0 0 3px var(--brass-2),0 10px 18px rgba(80,50,20,.3);}
.slot{width:100%;min-height:54px;display:flex;align-items:center;justify-content:center;padding:8px 12px;border-radius:8px;border:2px dashed var(--line);background:rgba(147,181,169,.12);color:var(--ink-3);font-family:var(--f-display);font-size:var(--fs-s);text-align:center;line-height:1.4;transition:border-color .2s,background .2s;}
.slot.ready{border-color:var(--brass);background:rgba(228,197,127,.2);color:var(--ink-2);animation:breathe 1.4s ease-in-out infinite;}
.slot.sel{border-style:solid;border-color:var(--brass);background:rgba(228,197,127,.2);}
.slot.filled{border:2px solid var(--malachite);background:rgba(43,113,85,.08);color:var(--ink);font-size:var(--fs-m);}
.slot.ink{animation:inkIn .6s ease-out;}
.slot:disabled:not(.filled){opacity:.42;}
.shake{animation:shake .45s;}

/* ---------- level 2 ---------- */
.codebar{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 14px;}
.codebar-k{font-size:var(--fs-xs);letter-spacing:.14em;color:var(--celadon-deep);font-weight:600;margin-right:4px;}
.codechar{width:46px;height:46px;display:grid;place-items:center;border-radius:6px;border:1px dashed var(--line);font-family:var(--f-display);font-size:28px;color:var(--ink-3);}
.codechar.on{background:var(--cinnabar);border:1px solid var(--cinnabar);color:var(--seal-ink);animation:stamp .5s;}
.l2-grid{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:start;}
.lotus-fig svg{display:block;width:100%;height:auto;}
.lotus-fig text{font-family:var(--f-display);font-size:17px;fill:var(--ink-2);paint-order:stroke;stroke:var(--silk);stroke-width:5px;stroke-linejoin:round;}
.lotus-fig .on text{fill:var(--malachite);font-weight:700;}
.lotus-fig line{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3;}
.lotus-fig .on line{stroke:var(--malachite);stroke-dasharray:none;}
.l2-rows{display:grid;gap:10px;min-width:0;}
.l2-colhead,.l2-row{display:grid;grid-template-columns:78px minmax(0,1fr) minmax(0,1.15fr);gap:10px;align-items:center;}
.l2-colhead span{font-size:var(--fs-xs);letter-spacing:.1em;color:var(--celadon-deep);font-weight:600;text-align:center;}
.part{display:flex;flex-direction:column;align-items:center;}
.part-ch{font-family:var(--f-display);font-size:30px;line-height:1.05;}
.part-asp{font-size:var(--fs-xs);color:var(--ink-2);}
.l2-row.done .part-ch{color:var(--malachite);}

/* =========================================================
   HUD, dialog, toast, menu
   ========================================================= */
function updateHUD(){
  $('#hudGroup').textContent = S.group;
  $('#hudMiss').textContent = S.mistakes;
  var dots = $('#hudFragDots'); dots.innerHTML = '';
  S.frags.forEach(function(f){ dots.append(h('span', { class:'frag-dot' + (f ? ' on' : '') })); });
  $('#hudFrags').setAttribute('aria-label', '手稿殘頁：已找回 ' + S.frags.filter(Boolean).length + ' 張，共 4 張');
  $('#btnHint').textContent = S.hints ? '提示 ' + S.hints : '提示';
  tickTimer();
}
function tickTimer(){
  if (mode !== 'play') return;
  var tag = $('#hudTimeTag'), lab = $('#hudTimeLabel'), el = $('#hudTime'), ms = elapsedMs();
  if (S.limit > 0){
    var rem = S.limit * 60000 - ms;
    if (rem >= 0){ lab.textContent = S.pausedAt ? '暫停' : '剩餘'; el.textContent = mmss(rem); tag.classList.toggle('warn', rem < 60000); tag.classList.remove('over'); }
    else {
      lab.textContent = '超時'; el.textContent = '+' + mmss(-rem); tag.classList.add('over'); tag.classList.remove('warn');
      if (!S.overtimeNoted && S.level < 5){ S.overtimeNoted = true; save(); if (!leafCtx && !busy) say(LINES.timeup); else toast(LINES.timeup); }
    }
  } else { lab.textContent = S.pausedAt ? '暫停' : '已用'; el.textContent = mmss(ms); }
}
var typeTimer = null, typeFull = '';
function say(text){
  var d = $('#dialog'), p = $('#dialogText');
  d.hidden = false; clearInterval(typeTimer); typeFull = text;
  if (reduceMotion){ p.textContent = text; return; }
  p.textContent = ''; var chars = Array.from(text), i = 0;
  typeTimer = setInterval(function(){ p.textContent += chars[i++]; if (i >= chars.length){ clearInterval(typeTimer); typeTimer = null; } }, 26);
}
function hideDialog(){ clearInterval(typeTimer); typeTimer = null; $('#dialog').hidden = true; }
var toastTimer = null;
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.className = 'toast show';
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.className = 'toast'; }, 2800);
}
function toggleMenu(force){
  var m = $('#menu'), open = force != null ? force : m.hidden;
  m.hidden = !open; $('#btnMenu').setAttribute('aria-expanded', String(open));
  $('#mSound').textContent = '音效：' + (S.sound ? '開' : '關');
  $('#mPause').textContent = S.pausedAt ? '繼續計時' : '暫停計時';
}

/* ---------- level 1: word wheels ---------- */
function renderL1(){
  var solved = S.level > 1, wrap = h('div', { class:'l1' });
  wrap.append(h('p', { class:'brief' }, solved ? '鎖匣已經打開。這五個字的讀音和意思要記熟：' : '每個轉輪刻著一個字。把轉輪轉到「讀音・意思」都正確的那一面，五個都轉好，再拉動機關。'));
  var wheels = h('div', { class:'wheels' });
  L1.forEach(function(w, i){
    var pos = solved ? w.ans : S.l1.pos[i], locked = solved || S.l1.ok[i];
    if (ui.rot[i] == null || solved) ui.rot[i] = pos;
    var faces = w.opts.map(function(o, k){ return h('div', { class:'face', style:'transform:rotateX(' + (-k * 90) + 'deg) translateZ(var(--half))' }, h('span', { class:'zy' }, o[0]), h('span', { class:'mean' }, o[1])); });
    var fb = ui.wheelFb && ui.wheelFb[i];
    wheels.append(h('div', { class:'wheel' + (locked ? ' locked' : '') + (fb ? ' bad' : ''), 'data-i':i },
      h('div', { class:'wheel-head' }, h('span', { class:'wheel-ch' }, w.ch), h('span', { class:'wheel-ctx' }, w.ctx[0], h('b', null, w.ctx[1]), w.ctx[2])),
      solved ? null : h('button', { class:'wbtn', type:'button', 'aria-label':w.ch + '：轉到上一面', disabled:locked, onclick:function(){ turnWheel(i, -1); } }, chevUp()),
      h('div', { class:'drum-win', role:'img', 'aria-label':w.ch + '，目前：' + w.opts[pos][0] + '，' + w.opts[pos][1], onclick:function(){ if (!locked) turnWheel(i, 1); } },
        h('div', { class:'drum', style:'transform:rotateX(' + (ui.rot[i] * 90) + 'deg)' }, faces),
        locked ? h('span', { class:'ok-badge', 'aria-hidden':'true' }, '對') : null),
      solved ? null : h('button', { class:'wbtn', type:'button', 'aria-label':w.ch + '：轉到下一面', disabled:locked, onclick:function(){ turnWheel(i, 1); } }, chevDown()),
      solved ? null : h('p', { class:'wheel-fb' }, fb || '')));
  });
  wrap.append(wheels);
  if (!solved){
    wrap.append(h('p', { class:'feedback' + (ui.fbGood ? ' good' : ''), role:'status' }, ui.fb || ''));
    wrap.append(h('div', { class:'actions' }, h('button', { class:'btn primary', type:'button', 'data-autofocus':'', onclick:tryL1 }, '拉動機關')));
  } else wrap.append(wordList());
  return wrap;
}
function wordList(){
  return h('ul', { class:'wordlist' }, WORDS.map(function(w){ return h('li', null, h('span', { class:'w' }, w[0]), h('span', { class:'p' }, w[1]), h('span', { class:'m' }, w[2])); }));
}
function turnWheel(i, d){
  if (S.level > 1 || S.l1.ok[i]) return;
  S.l1.pos[i] = (S.l1.pos[i] + d + 4) % 4; ui.rot[i] += d;
  var wheel = document.querySelector('.wheel[data-i="' + i + '"]');
  if (wheel){
    wheel.querySelector('.drum').style.transform = 'rotateX(' + (ui.rot[i] * 90) + 'deg)';
    var o = L1[i].opts[S.l1.pos[i]];
    wheel.querySelector('.drum-win').setAttribute('aria-label', L1[i].ch + '，目前：' + o[0] + '，' + o[1]);
    if (ui.wheelFb && ui.wheelFb[i]){ ui.wheelFb[i] = null; wheel.classList.remove('bad'); wheel.querySelector('.wheel-fb').textContent = ''; }
  }
  if (webgl) R3.lockWheels[i].rotation.x = S.l1.pos[i] * Math.PI / 2;
  SFX.tick(); save();
}
function tryL1(){
  if (busy) return;
  var wrong = [], fb = [];
  L1.forEach(function(w, i){
    if (S.l1.ok[i]) return;
    var p = S.l1.pos[i];
    if (p === w.ans){ S.l1.ok[i] = true; return; }
    var o = w.opts[p], a = w.opts[w.ans], sOk = o[0] === a[0], mOk = o[1] === a[1];
    fb[i] = (!sOk && !mOk) ? '音、義都不對' : (!sOk ? '讀音不對' : '意思不對');
    wrong.push(w.ch);
  });
  if (!wrong.length){
    ui.wheelFb = null; ui.fb = '喀啦——機關打開了！'; ui.fbGood = true; SFX.unlock(); save(); renderLeafBody(); solveL1(); return;
  }
  S.mistakes++; ui.wheelFb = fb; ui.fbGood = false;
  ui.fb = '還有 ' + wrong.length + ' 個轉輪沒轉對：' + wrong.map(function(c){ return '「' + c + '」'; }).join('、') + '。轉對的已經卡住了。';
  SFX.bad(); save(); updateHUD(); renderLeafBody();
}

/* ---------- tap-to-place shared ---------- */
function slotEl(id, filled, placeholder, disabled, extra){
  var isSel = ui.sel && ui.sel.kind === 'slot' && ui.sel.id === id;
  var ready = ui.sel && ui.sel.kind === 'tile' && !filled && !disabled;
  return h('button', { class:'slot' + (extra ? ' ' + extra : '') + (filled ? ' filled' : '') + (ready ? ' ready' : '') + (isSel ? ' sel' : '') + (ui.shake === id ? ' shake' : '') + (ui.placed === id ? ' ink' : ''),
    type:'button', disabled:!!(filled || disabled), 'aria-pressed':isSel ? 'true' : null, onclick:function(){ tapSlot(id); } }, filled || placeholder);
}
function trayEl(tiles, isPlaced){
  var left = tiles.filter(function(t){ return !isPlaced(t.id); });
  return h('div', { class:'tray', role:'group', 'aria-label':'木牌' },
    h('p', { class:'tray-k' }, '木牌｜先點一塊木牌，再點要放的格子'),
    h('div', { class:'tray-tiles' }, left.map(function(t){
      var sel = ui.sel && ui.sel.kind === 'tile' && ui.sel.id === t.id;
      return h('button', { class:'tile' + (sel ? ' sel' : '') + (ui.shake === t.id ? ' shake' : ''), type:'button', 'aria-pressed':String(!!sel), onclick:function(){ tapTile(t.id); } }, t.label);
    })));
}
function tapTile(id){
  if (busy) return;
  if (ui.sel && ui.sel.kind === 'slot'){ var s = ui.sel.id; ui.sel = null; leafCtx.place(id, s); return; }
  ui.sel = (ui.sel && ui.sel.id === id) ? null : { kind:'tile', id:id };
  ui.shake = null; ui.placed = null; SFX.tick(); renderLeafBody();
}
function tapSlot(id){
  if (busy) return;
  if (ui.sel && ui.sel.kind === 'tile'){ var t = ui.sel.id; ui.sel = null; leafCtx.place(t, id); return; }
  ui.sel = (ui.sel && ui.sel.id === id) ? null : { kind:'slot', id:id };
  ui.shake = null; ui.placed = null; renderLeafBody();
}
function wrongPlace(tileId, slotId, msg){
  S.mistakes++; ui.shake = slotId; ui.placed = null; ui.fb = msg; ui.fbGood = false;
  SFX.bad(); save(); updateHUD(); renderLeafBody();
  setTimeout(function(){ ui.shake = null; }, 500);
}

function placeL2(tileId, slotId){
  var parts = slotId.split('-'), kind = parts[0], row = parts[1], tRow = tileId.slice(2);

  if (!kindOk){ ui.fb = '這塊木牌要放在另一欄。'; renderLeafBody(); return; }
  if (tRow !== row){
    var r2 = L2.rows.find(function(x){ return x.id === row; });
    wrongPlace(tileId, slotId, DECOY[tileId] || ('這塊不是寫「' + r2.part + '・' + r2.aspect + '」，再對照看看。'));
    return;
  }
  S.l2[kind][row] = true; ui.placed = slotId; ui.shake = null; ui.fbGood = true;
  var rr = L2.rows.find(function(x){ return x.id === row; });
  if (S.l2.text[row] && S.l2.virtue[row]) ui.fb = '「' + rr.code + '」字浮現了！' + rr.part + '（' + rr.aspect + '）象徵：' + rr.virtue + '。';
  else ui.fb = '放對了！';
  if (S.l2.step === 1 && L2.rows.every(function(x){ return S.l2.text[x.id]; })){ S.l2.step = 2; ui.fb = '原文全部歸位！接著配對君子之德。'; }

/* ---------- level 3: flower board ---------- */
function rowDone3(id){ return S.level > 3 || [0,1,2].every(function(ci){ return S.l3.placed[id + '-' + ci]; }); }
function renderL3(){
  var solved = S.level > 3, wrap = h('div', { class:'l3' });
  wrap.append(h('p', { class:'brief' }, solved ? '推演盤已經歸位。' : '把木牌放進表格：菊、牡丹、蓮各象徵什麼人？作者對它們有什麼感嘆？誰襯托誰？'));
  var table = h('div', { class:'l3-table', role:'table', 'aria-label':'百花品格推演表' });
  table.append(h('div', { role:'columnheader' }));
  L3.cols.forEach(function(c){ table.append(h('div', { class:'l3-colhead c-' + c.id, role:'columnheader' }, c.name)); });
  table.append(h('div', { class:'l3-rowhead', role:'rowheader' }, h('b', null, '愛好者'), h('small', null, '已知')));
  L3.given.forEach(function(v){ table.append(h('div', { class:'l3-given', role:'cell' }, v)); });
  L3.rows.forEach(function(r){
    table.append(h('div', { class:'l3-rowhead', role:'rowheader' }, h('b', null, r.label), h('small', null, r.sub)));
    r.vals.forEach(function(v, ci){ var id = r.id + '-' + ci, done = solved || S.l3.placed[id]; table.append(h('div', { role:'cell' }, slotEl('s-' + id, done ? v : null, '？', false))); });
    if (rowDone3(r.id)) table.append(h('p', { class:'l3-note' }, h('b', { 'aria-hidden':'true' }, '解'), h('span', null, L3.notes[r.id])));
  });
  wrap.append(h('div', { class:'l3-wrap' }, table));
  if (!solved){
    wrap.append(h('p', { class:'feedback' + (ui.fbGood ? ' good' : ''), role:'status' }, ui.fb || ''));
    wrap.append(trayEl(L3T, function(id){ return !!S.l3.placed[id]; }));
  }
  return wrap;
}
function placeL3(tileId, slotId){
  var target = slotId.slice(2);
  if (tileId !== target){
    var tr = tileId.split('-')[0], sr = target.split('-')[0];
    var row = L3.rows.find(function(x){ return x.id === sr; });
    wrongPlace(tileId, slotId, tr === sr ? '這塊屬於「' + row.label + '」這一列，但不是這種花。' : '這塊木牌不屬於「' + row.label + '」這一列。');
    return;
  }
  var wasDone = rowDone3(target.split('-')[0]);
  S.l3.placed[target] = true; ui.placed = slotId; ui.fbGood = true;
  var rowId = target.split('-')[0];
  ui.fb = (!wasDone && rowDone3(rowId)) ? '這一列完成了！' : '放對了！';
  SFX.ok(); save(); renderLeafBody();
  if (L3.rows.every(function(r){ return rowDone3(r.id); })) solveL3();
}

/* ---------- level 4: clues and chest ---------- */
function renderClue(ci){
  var c = CLUES[ci], found = S.l4.found[c.pos] != null || S.level > 4, tried = S.l4.tried[c.id] || [];
  var wrap = h('div', { class:'clue' });
  wrap.append(h('blockquote', { class:'quote' }, c.quote));
  wrap.append(h('p', { class:'q' }, c.q));
  wrap.append(h('div', { class:'opts' }, c.opts.map(function(o){
    var isAns = o[0] === c.ans, wrong = tried.indexOf(o[0]) >= 0;
    return h('button', { class:'opt' + (found && isAns ? ' right' : '') + (wrong ? ' wrong' : ''), type:'button', disabled:found || wrong, onclick:function(){ answerClue(ci, o[0]); } },
      h('span', { class:'opt-n' }, String(o[0])), h('span', { class:'opt-t' }, o[1]));
  })));
  if (found){
    wrap.append(h('div', { class:'digit-reveal' },
      h('div', { class:'digit-row' }, h('span', { class:'digit-k' }, '第' + CN[c.pos + 1] + '碼'), h('span', { class:'digit' }, String(c.ans))),
      h('p', { class:'why' }, c.why)));
    wrap.append(h('div', { class:'actions' }, h('button', { class:'btn primary', type:'button', 'data-autofocus':'', onclick:function(){ closeLeaf(); } }, '記下數字')));
  } else wrap.append(h('p', { class:'feedback' + (ui.fbGood ? ' good' : ''), role:'status' }, ui.fb || '提示：答對的選項數字，就是寶箱密碼的其中一碼。'));
  return wrap;
}
function answerClue(ci, num){
  var c = CLUES[ci];
  if (S.l4.found[c.pos] != null || busy) return;
  if (num === c.ans){
    S.l4.found[c.pos] = num; ui.justFound = ci; ui.fb = ''; SFX.ok(); save();
    if (webgl && c.id === 'incense') R3.incenseNote.visible = false;
    updateMarkers(); renderLeafBody();
  } else {
    (S.l4.tried[c.id] = S.l4.tried[c.id] || []).push(num);
    S.mistakes++; ui.fb = c.wrong[num] || '再想一想。'; ui.fbGood = false; SFX.bad(); save(); updateHUD(); renderLeafBody();

  S = freshState(); S.group = name.slice(0, 12); S.limit = selectedLimit; S.sound = keepSound;
  S.phase = 'play'; S.startedAt = Date.now();
  ui = { sel:null, shake:null, placed:null, fb:'', fbGood:false, wheelFb:null, rot:[], drot:[], justFound:-1 };
  save(); audio();
  enterPlay(true);
}
function continueGame(){
  var saved = loadSaved(); if (!saved) return;
  S = saved; audio();
  enterPlay(false);
  if (S.level > 4) setTimeout(function(){ openCert(); }, 300);
}
function enterPlay(fresh){
  $('#title').hidden = true; $('#hud').hidden = false; mode = 'play'; perf.n = 0; perf.acc = 0;
  applyStateTo3D(); updateHUD();
  if (webgl){
    var tg = V(ST[primaryTarget() || 'lock'].target), ang = anglesTo(HOME, tg);
    if (fresh){ camState.pos.set(0, 2.3, 2.4); camState.pitch = -0.35; }
    camTo(HOME, ang.yaw, clamp(ang.pitch, -0.3, 0.15), fresh ? 1600 : 700, function(){ camLocked = false; say(fresh ? LINES.intro : (S.level > 4 ? LINES.done : LINES.resume)); });
  } else say(fresh ? LINES.intro : LINES.resume);
}

/* =========================================================
   setup
   ========================================================= */
var selectedLimit = 15;
function syncChips(){
  var v = $('#groupName').value.trim();
  Array.prototype.forEach.call(document.querySelectorAll('#groupChips .chip'), function(b){ b.setAttribute('aria-pressed', String(b.textContent === v)); });
}
function syncLimit(){
  selectedLimit = S.limit;
  Array.prototype.forEach.call(document.querySelectorAll('#limitSeg button'), function(b){ b.setAttribute('aria-checked', String(+b.dataset.min === selectedLimit)); });
}
function setupUI(){
  var chips = $('#groupChips');
  ['一','二','三','四','五','六','七','八'].forEach(function(n){
    chips.append(h('button', { class:'chip', type:'button', 'aria-pressed':'false', onclick:function(e){ $('#groupName').value = '第' + n + '組'; syncChips(); } }, '第' + n + '組'));
  });
  $('#groupName').addEventListener('input', syncChips);
  Array.prototype.forEach.call(document.querySelectorAll('#limitSeg button'), function(b){
    b.addEventListener('click', function(){ S.limit = +b.dataset.min; syncLimit(); });
  });
  $('#startBtn').addEventListener('click', startGame);
  $('#continueBtn').addEventListener('click', continueGame);
  $('#btnPouch').addEventListener('click', openPouch);
  $('#btnHint').addEventListener('click', showHint);
  $('#btnMenu').addEventListener('click', function(){ toggleMenu(); });
  $('#mPause').addEventListener('click', function(){ toggleMenu(false); if (S.pausedAt) resumeGame(); else pauseGame(); });
  $('#mSound').addEventListener('click', function(){ S.sound = !S.sound; save(); toggleMenu(true); if (S.sound) SFX.ok(); });
  $('#mRestart').addEventListener('click', function(){ toggleMenu(false); if (busy){ toast('機關正在轉動，稍等一下。'); return; } if (leafCtx) closeLeaf(true); confirmRestart(); });
  $('#hudFrags').addEventListener('click', function(){ if (!leafCtx && !busy) openManuscript(false); });
  $('#turnL').addEventListener('click', function(){ turn(1); });
  $('#turnR').addEventListener('click', function(){ turn(-1); });
  $('#dialog').addEventListener('click', function(){
    if (typeTimer){ clearInterval(typeTimer); typeTimer = null; $('#dialogText').textContent = typeFull; }
    else hideDialog();
  });
  var nav = $('#quickNav');
  Object.keys(ST).forEach(function(id){ nav.append(h('button', { type:'button', onclick:function(){ onStationTap(id); } }, ST[id].name)); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ if (!$('#menu').hidden){ toggleMenu(false); return; } if (leafCtx && !leafCtx.noClose && !busy){ closeLeaf(); return; } }
    if (leafCtx || mode !== 'play') return;
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'ArrowLeft') turn(1);
    if (e.key === 'ArrowRight') turn(-1);
  });
  document.addEventListener('pointerdown', function(e){ var m = $('#menu'); if (!m.hidden && !m.contains(e.target) && e.target !== $('#btnMenu') && !$('#btnMenu').contains(e.target)) toggleMenu(false); }, true);
  window.addEventListener('resize', onResize);
  setInterval(tickTimer, 250);
}
function waitFonts(){
  if (!document.fonts || !document.fonts.load) return;
  var sample = '濂溪書堂香遠益清予謂菊花之隱逸者也牡丹富貴蓮君子託物言志周印茂叔蕃濯漣褻鮮品正反襯主體寫';
  Promise.race([
    Promise.all([document.fonts.load('700 60px "LXGW WenKai TC"', sample), document.fonts.load('400 40px "LXGW WenKai TC"', sample)]),
    new Promise(function(r){ setTimeout(r, 8000); })
  ]).then(function(){ if (webgl) drawTextTextures(); }).catch(function(){});
}
function boot(hotData){
  setupUI();
  var ok = initThree();
  if (!ok){ webgl = false; $('#quickNav').classList.add('show'); }
  setupPointer();
  var hot = hotData && hotData.S;
  if (hot && hot.v === 1){ S = hot; }
  else { var saved = loadSaved(); if (saved){ S.group = saved.group; S.limit = saved.limit; S.sound = saved.sound; } }
  if (hot && hot.phase !== 'title' && hot.startedAt){ $('#title').hidden = true; enterPlay(false); }
  else showTitle();
  requestAnimationFrame(loop);
  waitFonts();
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function(){ return { S:S }; }); } catch(e){}
var hotApi = window.claude && window.claude.hot;
if (hotApi && hotApi.ready) hotApi.ready(boot); else boot((hotApi && hotApi.data) || {});
})();
</script>
